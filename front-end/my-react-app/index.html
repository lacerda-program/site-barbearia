<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>WE Barber | Barbearia Premium</title>
    <meta name="description" content="WE Barber - Em desenvolvimento. Em breve, um novo padrão de excelência em barbearia." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

              <p>por mais noticias acompanhe nosse instagram:</p>

              <a href="https://www.instagram.com/webarbearia._/" target="_blank" rel="noopener noreferrer" class="instagram-btn">

        <div class="footer-line"></div>
